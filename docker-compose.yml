version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./travelmind.db
      - CHROMA_DB_PATH=/workspace/chroma_db
    # Seed the database and reviews first, then launch the FastAPI server
    command: >
      sh -c "python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/workspace
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
